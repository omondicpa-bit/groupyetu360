name: Deploy Edge Functions to STAGING

# Runs only for the staging branch, and only ever targets the STAGING
# Supabase project. Live functions are still deployed by hand.
on:
  push:
    branches: [staging]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-staging-functions.yml'
  workflow_dispatch:

concurrency:
  group: staging-functions
  cancel-in-progress: false

env:
  STAGING_REF: zrjctzauufromazxrpvb   # staging project. Never the live ref.
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Refuse to run against live
        run: |
          if [ "$STAGING_REF" = "eengldzvvgplgzvbutal" ]; then echo "This is the LIVE project. Stopping."; exit 1; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Add the SUPABASE_ACCESS_TOKEN repository secret first."; exit 1; fi

      - name: Mark the project as staging (SMS allowlist on)
        run: |
          supabase secrets set --project-ref "$STAGING_REF" GY_ENV=staging DARAJA_ENV=sandbox
          if [ -n "${{ secrets.STAGING_SMS_ALLOWLIST }}" ]; then
            supabase secrets set --project-ref "$STAGING_REF" SMS_ALLOWLIST="${{ secrets.STAGING_SMS_ALLOWLIST }}"
          fi

      - name: Deploy functions called by the app
        run: |
          for fn in admin-user-update daraja-charge daraja-payout daraja-verify \
                    send-2fa-otp verify-2fa-otp send-broadcast send-group-notification \
                    send-sms-celcom sync-settlement-batches taya-assistant; do
            echo "::group::$fn"
            supabase functions deploy "$fn" --project-ref "$STAGING_REF" --use-api
            echo "::endgroup::"
          done

      - name: Deploy Safaricom callbacks (no JWT, Safaricom calls these)
        run: |
          for fn in daraja-callback daraja-payout-callback; do
            supabase functions deploy "$fn" --project-ref "$STAGING_REF" --use-api --no-verify-jwt
          done
